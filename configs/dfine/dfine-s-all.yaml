backbone:
  # [from, module, args]
  - [-1, StemBlock, [16, 16, True]] # 0-P2/4
  - [-1, HG_Stage, [16, 64, 1, 3, False, False, 3, True, 'se']] # 1-P2/4
  - [-1, HG_Stage, [32, 256, 1, 3, True, False, 3, True, 'se']] # 2-P3/8
  - [-1, HG_Stage, [64, 512, 2, 3, True, True, 5, True, 'se']] # 3-P4/16
  - [-1, HG_Stage, [128, 1024, 1, 3, True, True, 5, True, 'se']] # 4-P5/32


  # =========================
  # DHEC
  # shallow defect edge enhancement
  # =========================
  - [2, DHEC, [256]] # 5-P3/8



encoder:

  # feature projection
  - [5, ConvNormLayer_fuse, [256, 1, 1]] # 6-P3/8
  - [3, ConvNormLayer_fuse, [256, 1, 1]] # 7-P4/16
  - [4, ConvNormLayer_fuse, [256, 1, 1]] # 8-P5/32


  # Transformer encoder
  - [-1, TransformerEncoderBlock,
     [8, 1024, 0.1, "relu", 10000, False]] # 9-P5/32



  # =========================
  # DFAF 1
  # P5 -> P4
  # =========================

  - [-1, ConvNormLayer_fuse, [256,1,1]] #10
  - [-1, nn.Upsample, [None,2,"nearest"]] #11

  - [[-1,7], DFAF, [256]] #12-P4/16

  - [-1, RepNCSPELAN4,
     [256,512,64,1,False,'silu']] #13-P4/16



  # =========================
  # DFAF 2
  # P4 -> P3
  # =========================

  - [-1, ConvNormLayer_fuse,[256,1,1]] #14
  - [-1, nn.Upsample,[None,2,"nearest"]] #15


  - [[-1,6], DFAF,[256]] #16-P3/8


  - [-1,RepNCSPELAN4,
     [256,512,64,1,False,'silu']] #17-P3/8



  # =========================
  # bottom-up
  # =========================

  - [-1, SCDown,[256,3,2,'silu']] #18-P4/16

  - [[-1,14],Concat,[]] #19

  - [-1,RepNCSPELAN4,
     [256,512,64,1,False,'silu']] #20-P4/16



  - [-1, SCDown,[256,3,2,'silu']] #21-P5/32


  - [[-1,10],Concat,[]] #22


  - [-1,RepNCSPELAN4,
     [256,512,64,1,False,'silu']] #23-P5/32



  # =========================
  # DD-LKA
  # high-level defect structure enhancement
  # =========================

  - [-1, DD_LKA,[256]] #24-P5/32



decoder:

  - [[17,20,24],
     DFINETransformer,
     {
       "feat_strides":[8,16,32],
       "hidden_dim":256,
       "num_levels":3,
       "num_layers":3,
       "num_points":[3,6,3],
       "dim_feedforward":1024
     }]