__include__: [
  '../dataset/aluminium_detection.yml',
  '../runtime.yml',
  '../base/dataloader_dfine.yml',
  '../base/optimizer.yml',
  '../base/dfine_hgnetv2.yml',
]

output_dir: ./outputs/dfine_hgnetv2_s_aluminium_baseline

model: DEIM_MG

DEIM_MG:
  yaml_path: configs/ultralytics-yaml/cfg/dfine-s.yaml

optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*backbone)(?!.*norm|bn).*$'
      lr: 0.0001
    -
      params: '^(?=.*backbone)(?=.*norm|bn).*$'
      lr: 0.0001
      weight_decay: 0.
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.

  lr: 0.0002
  betas: [0.9, 0.999]
  weight_decay: 0.0001


# Increase to search for the optimal ema
epoches: 200 # 120 + 4n
train_dataloader:
  dataset:
    transforms:
      policy:
        epoch: 188
  collate_fn:
    stop_epoch: 188
    ema_restart_decay: 0.9999
    base_size_repeat: 20
